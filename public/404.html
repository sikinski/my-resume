<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Получаем путь из URL
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      
      // Base URL для репозитория my-resume
      const baseURL = '/my-resume/';
      
      // Если путь уже содержит baseURL, убираем его
      let cleanPath = path.replace(new RegExp('^' + baseURL.replace(/\/$/, '')), '');
      if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
      
      // Формируем redirect URL
      const redirectURL = baseURL + 'index.html' + (cleanPath !== '/' ? cleanPath : '') + search + hash;
      
      // Перенаправляем
      window.location.replace(redirectURL);
    </script>
    <meta http-equiv="refresh" content="0; url=./index.html">
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
